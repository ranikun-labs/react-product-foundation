name: PR verification

# PR 병합 전 최소 품질 게이트로 `pnpm verify`(format:check, lint, typecheck, test, build,
# verify:leakage)를 수행한다. e2e·배포·secret 사용은 포함하지 않는다.
# 외부 Action은 커밋 SHA로 고정하고 태그를 주석으로 병기한다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify (format, lint, typecheck, unit test, build, leakage)
        run: pnpm run verify
